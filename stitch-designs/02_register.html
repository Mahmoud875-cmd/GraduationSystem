  </head><body class="bg-surface pt-safe pb-safe flex flex-col min-h-screen"><main class="flex flex-col relative w-full bg-surface flex-1"><div class="flex flex-col w-full px-gutter py-space-xl max-w-md mx-auto justify-center flex-1">
<!-- Brand / Header Section -->
<div class="flex flex-col items-center mb-space-xl text-center">
<div class="w-16 h-16 rounded-full bg-primary-fixed flex items-center justify-center text-primary mb-space-md shadow-sm">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<h1 class="font-headline-md text-on-surface mb-space-xs">سامانه پروژه‌ها</h1>
<p class="font-body-md text-outline">مدیریت یکپارچه پایان‌نامه‌ها و پروژه‌های دانشگاهی</p>
</div>
<!-- Main Registration Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-lg p-space-lg flex flex-col gap-space-md transition-all duration-300">
<div class="flex flex-col gap-space-xs mb-space-sm">
<h2 class="font-headline-sm text-on-surface">ثبت‌نام در سامانه</h2>
<p class="font-body-sm text-outline">لطفاً اطلاعات خود را جهت ایجاد حساب کاربری وارد کنید.</p>
</div>
<!-- Registration Form -->
<form class="flex flex-col gap-space-md" onsubmit="event.preventDefault();">
<!-- Full Name Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-on-surface-variant">نام و نام خانوادگی</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute right-3 text-outline">person</span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md py-3 pr-11 pl-4 rounded-lg outline-none focus:ring-2 focus:ring-primary/50 transition-all placeholder:text-outline/60" placeholder="مثال: علی رضایی" type="text"/>
</div>
</div>
<!-- University Email Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-on-surface-variant">ایمیل دانشگاهی</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute right-3 text-outline">mail</span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md py-3 pr-11 pl-4 rounded-lg outline-none focus:ring-2 focus:ring-primary/50 transition-all placeholder:text-outline/60 text-left dir-ltr" placeholder="name@university.ac.ir" type="email"/>
</div>
</div>
<!-- Account Type Selection -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-on-surface-variant">نوع حساب کاربری</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute right-3 text-outline">badge</span>
<select class="w-full bg-surface-container-low text-on-surface font-body-md py-3 pr-11 pl-4 rounded-lg outline-none focus:ring-2 focus:ring-primary/50 transition-all appearance-none cursor-pointer">
<option disabled="" selected="" value="">انتخاب کنید...</option>
<option value="student">دانشجو</option>
<option value="advisor">استاد راهنما</option>
</select>
<span class="material-symbols-outlined absolute left-3 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-on-surface-variant">رمز عبور</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute right-3 text-outline">lock</span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md py-3 pr-11 pl-12 rounded-lg outline-none focus:ring-2 focus:ring-primary/50 transition-all placeholder:text-outline/60" id="password-input" placeholder="••••••••" type="password"/>
<button class="absolute left-3 text-outline hover:text-on-surface transition-colors flex items-center justify-center p-1" onclick="togglePassword('password-input', 'toggle-icon-1')" type="button">
<span class="material-symbols-outlined text-xl" id="toggle-icon-1">visibility_off</span>
</button>
</div>
</div>
<!-- Confirm Password Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-on-surface-variant">تکرار رمز عبور</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute right-3 text-outline">lock_reset</span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md py-3 pr-11 pl-12 rounded-lg outline-none focus:ring-2 focus:ring-primary/50 transition-all placeholder:text-outline/60" id="confirm-password-input" placeholder="••••••••" type="password"/>
<button class="absolute left-3 text-outline hover:text-on-surface transition-colors flex items-center justify-center p-1" onclick="togglePassword('confirm-password-input', 'toggle-icon-2')" type="button">
<span class="material-symbols-outlined text-xl" id="toggle-icon-2">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary-container font-label-lg py-3.5 px-6 rounded-lg flex items-center justify-center gap-2 hover:opacity-95 active:scale-[0.99] transition-all shadow-md mt-space-sm" type="submit">
<span>ثبت‌نام</span>
<span class="material-symbols-outlined text-lg rtl:rotate-180">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer Link -->
<div class="flex items-center justify-center mt-space-lg">
<p class="font-body-md text-outline">
      قبلاً ثبت‌نام کرده‌اید؟ 
      <a class="text-primary font-label-lg hover:underline inline-flex items-center gap-1 mr-1" href="#">
<span>ورود</span>
</a>
</p>
</div>
<!-- Delightful Interactive Script -->
<script>
    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility_off';
      }
    }
  </script>
</div></main></body></html>
