<!DOCTYPE html>

<html dir="rtl" lang="fa"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;font-family:'Vazirmatn',sans-serif;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = {darkMode: "class", theme: { extend: { "colors": { "surface-variant": "#e2e2e2", "inverse-primary": "#c3c0ff", "secondary": "#555f6f", "error-container": "#ffdad6", "on-primary-fixed-variant": "#3323cc", "on-tertiary-fixed": "#191c1e", "on-primary-container": "#dad7ff", "primary-fixed": "#e2dfff", "primary-container": "#4f46e5", "tertiary-fixed": "#e1e2e4", "on-error": "#ffffff", "tertiary-container": "#5e6062", "on-error-container": "#93000a", "on-secondary-fixed": "#121c2a", "surface-bright": "#f9f9f9", "outline-variant": "#c7c4d8", "outline": "#777587", "tertiary-fixed-dim": "#c5c6c8", "on-background": "#1a1c1c", "inverse-on-surface": "#f0f1f1", "surface-container-highest": "#e2e2e2", "background": "#f9f9f9", "on-tertiary-fixed-variant": "#444749", "error": "#ba1a1a", "surface-container-lowest": "#ffffff", "on-primary": "#ffffff", "primary-fixed-dim": "#c3c0ff", "surface-container": "#eeeeee", "secondary-fixed-dim": "#bdc7d9", "primary": "#3525cd", "secondary-container": "#d6e0f3", "on-surface": "#1a1c1c", "on-secondary": "#ffffff", "on-tertiary": "#ffffff", "on-primary-fixed": "#0f0069", "tertiary": "#46484a", "surface-tint": "#4d44e3", "on-tertiary-container": "#dadbdd", "on-secondary-fixed-variant": "#3d4756", "on-surface-variant": "#464555", "inverse-surface": "#2f3131", "secondary-fixed": "#d9e3f6", "on-secondary-container": "#596373", "surface-container-low": "#f3f3f4", "surface-container-high": "#e8e8e8", "surface": "#f9f9f9", "surface-dim": "#dadada" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "margin": "2rem", "gutter": "1.5rem", "space-md": "1rem", "space-xl": "2.5rem", "space-sm": "0.5rem", "space-xs": "0.25rem", "space-lg": "1.5rem" }, "fontFamily": { "label-sm": ["Vazirmatn"], "body-md": ["Vazirmatn"], "headline-lg": ["Vazirmatn"], "label-lg": ["Vazirmatn"], "body-lg": ["Vazirmatn"], "headline-sm": ["Vazirmatn"], "body-sm": ["Vazirmatn"], "label-md": ["Vazirmatn"], "headline-md": ["Vazirmatn"] }, "fontSize": { "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "500" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }], "label-lg": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }] } } } };</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface pt-safe pb-safe flex flex-col min-h-screen"><main class="flex flex-col relative w-full bg-surface flex-1"><div class="flex flex-col w-full min-h-full px-6 py-8 justify-between">
<!-- Top Branding & Logo -->
<div class="flex flex-col items-center mt-6">
<div class="w-16 h-16 rounded-2xl bg-primary-container flex items-center justify-center text-on-primary shadow-lg mb-4">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<h1 class="font-headline-sm text-on-surface text-center mb-1">سامانه پروژه‌ها</h1>
<p class="font-body-md text-secondary text-center">مدیریت پروژه‌های پایانی و پایان‌نامه‌ها</p>
</div>
<!-- Main Login Card -->
<div class="w-full max-w-md mx-auto bg-surface-container-lowest rounded-xl shadow-md p-6 my-8">
<h2 class="font-headline-md text-on-surface mb-6 text-right">ورود به سامانه</h2>
<form class="flex flex-col gap-4" onsubmit="event.preventDefault();">
<!-- Email Input Field -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-on-surface-variant text-right">ایمیل دانشگاهی</label>
<div class="relative flex items-center">
<span class="absolute right-3 text-outline material-symbols-outlined">mail</span>
<input class="w-full pr-10 pl-4 py-3 bg-surface-container-low rounded-lg font-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container transition-all text-right" dir="ltr" placeholder="name@university.ac.ir" type="email"/>
</div>
</div>
<!-- Password Input Field -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-on-surface-variant text-right">رمز عبور</label>
<div class="relative flex items-center">
<span class="absolute right-3 text-outline material-symbols-outlined">lock</span>
<input class="w-full pr-10 pl-12 py-3 bg-surface-container-low rounded-lg font-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container transition-all text-right" dir="ltr" id="password-input" placeholder="••••••••" type="password"/>
<button class="absolute left-3 text-outline hover:text-on-surface transition-colors focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-1">
<a class="font-label-md text-primary-container hover:underline" href="#">رمز عبور را فراموش کرده‌اید؟</a>
</div>
<!-- Submit Button -->
<button class="w-full mt-4 py-3 bg-primary-container text-on-primary font-label-lg rounded-lg shadow-md hover:opacity-95 active:scale-[0.99] transition-all flex items-center justify-center gap-2" type="submit">
<span>ورود</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
</div>
<!-- Bottom Register Link -->
<div class="flex items-center justify-center gap-2 mb-4">
<span class="font-body-md text-secondary">حساب کاربری ندارید؟</span>
<a class="font-label-lg text-primary-container hover:underline" href="#">ثبت‌نام</a>
</div>
<!-- Interactive Script for Password Toggle -->
<script>
    function togglePassword() {
      const passwordInput = document.getElementById('password-input');
      const eyeIcon = document.getElementById('eye-icon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.textContent = 'visibility_off';
      } else {
        passwordInput.type = 'password';
        eyeIcon.textContent = 'visibility';
      }
    }
  </script>
</div></main></body></html>
